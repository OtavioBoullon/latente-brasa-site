<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poupai</title><style>body{font-family:system-ui;margin:0;display:grid;place-items:center;min-height:100vh;color:#061b39}.l{display:flex;gap:10px;align-items:center;font-weight:800}.s{width:18px;height:18px;border:3px solid #dce8df;border-top-color:#2bc542;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="l"><span class="s"></span>Carregando Poupai…</div><script>(async()=>{try{let h='';const base='https://raw.githubusercontent.com/OtavioBoullon/latente-brasa-site/poupai-v4-full-public/public/poupai-v4-full/';for(let i=0;i<=10;i++){const n=String(i).padStart(2,'0');const r=await fetch(base+'chunks/'+n+'.txt?cb='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('chunk '+n);h+=await r.text()}const ir=await fetch(base+'integration-v25.txt?cb='+Date.now(),{cache:'no-store'});if(ir.ok){const js=await ir.text();const marker='</body>';const injected='<script>'+js+'<\/script>';h=h.includes(marker)?h.replace(marker,injected+marker):h+injected}document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<p>Não foi possível carregar o Poupai.</p>';console.error(e)}})()</script></body></html>
