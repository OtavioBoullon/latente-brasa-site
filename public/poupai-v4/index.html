<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poupai</title><style>body{font-family:system-ui;margin:0;display:grid;place-items:center;min-height:100vh;color:#061b39}.l{display:flex;gap:10px;align-items:center;font-weight:800}.s{width:18px;height:18px;border:3px solid #dce8df;border-top-color:#2bc542;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="l"><span class="s"></span>Carregando Poupai…</div><script>(async()=>{try{let b='';const base='https://raw.githubusercontent.com/OtavioBoullon/latente-brasa-site/main/public/poupai-v4/payload/';for(let i=0;i<5;i++)b+=await(await fetch(base+'p'+i+'.txt',{cache:'no-store'})).text();const bin=atob(b),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip'),txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close()}catch(e){document.body.innerHTML='<p>Não foi possível carregar o Poupai.</p>';console.error(e)}})()</script></body></html>
