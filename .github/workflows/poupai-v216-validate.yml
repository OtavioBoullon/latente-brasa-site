name: Poupai V2.16 Validation
on:
  push:
    branches: [poupai-v4-full-public]
    paths: ['.github/workflows/poupai-v216-validate.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Syntax and safety
        run: |
          cp public/poupai-v4-full/integration-v213.txt /tmp/v213.js
          cp public/poupai-v4-full/mobile-render-fix-v214.txt /tmp/v214.js
          cp public/poupai-v4-full/mobile-pdf-fast-v216.txt /tmp/v216.js
          cp public/poupai-v4-full/paywall-v217.txt /tmp/paywall.js
          cp public/poupai-v4-full/integration-v25.txt /tmp/loader.js
          node --check /tmp/v213.js
          node --check /tmp/v214.js
          node --check /tmp/v216.js
          node --check /tmp/paywall.js
          node --check /tmp/loader.js
      - name: Debug mobile PDF DOM
        run: |
          npm install --no-save puppeteer-core@24 pdf-lib@1 >/dev/null 2>&1
          cat > mobile-debug.cjs <<'NODE'
          const fs=require('fs'); const {execSync}=require('child_process'); const puppeteer=require('puppeteer-core'); const {PDFDocument,StandardFonts}=require('pdf-lib');
          const chrome=(()=>{for(const c of ['google-chrome','chromium','chromium-browser']){try{return execSync('which '+c).toString().trim()}catch(_){}}})(); if(!chrome)throw new Error('Chrome not found');
          (async()=>{
            const pdf=await PDFDocument.create(); const p=pdf.addPage([595,842]); const font=await pdf.embedFont(StandardFonts.Helvetica); let y=800; for(const line of ['CLIENTE TESTE','RUA TESTE 100','05115-090 S PAULO - SP','Telefonica Brasil S.A. Av. Berrini - CEP: 04571-936 - Sao Paulo - SP','VIVO TOTAL','Vivo Fibra 700Mbps. 1 120,00','Subtotal Vivo Fibra 120,00','Vivo Pos Familia 120GB 1 150,00','Linha Adicional 1 50,00','Subtotal Vivo Celular 200,00','Total a pagar 320,00']){p.drawText(line,{x:40,y,size:12,font});y-=24} fs.writeFileSync('bill.pdf',await pdf.save());
            const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage']}); const page=await browser.newPage(); await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
            const errs=[]; page.on('pageerror',e=>errs.push('PAGEERROR '+e.message)); page.on('console',m=>{if(['error','warning'].includes(m.type()))errs.push('CONSOLE '+m.type()+' '+m.text())});
            await page.setRequestInterception(true); page.on('request',req=>{const u=req.url(); if(u.includes('/api/read-bill'))return req.respond({status:500,contentType:'application/json',body:'{"error":"FAST_PATH_FAILED"}'}); if(u.includes('/api/find-offers'))return req.respond({status:200,contentType:'application/json',body:JSON.stringify({result:{offers:[{provider:'TIM',planName:'TIM 700 Mega',speedMbps:700,priceMonthly:99.99,technology:'Fibra',sourceUrl:'https://tim.com.br'}]}})}); if(u.includes('/api/run-pipeline'))return req.respond({status:200,contentType:'application/json',body:JSON.stringify({finalDecision:'ANALISE_INCONCLUSIVA',provisionalDecision:'PRELIMINAR',message:'Comparação preliminar',analysis:{comparisons:[]},blockingReasons:[]})}); req.continue()});
            await page.goto('https://latente-brasa-site.vercel.app/poupai-v4-full/index.html?v=217debug#analisar',{waitUntil:'networkidle2',timeout:60000}); await page.waitForFunction(()=>window.__POUPAI_V216_LOADED__&&window.__POUPAI_PAYWALL_V217_LOADED__,{timeout:30000}); const input=await page.$('#p213File'); await input.uploadFile('bill.pdf'); await page.click('#p213Analyze'); await page.waitForSelector('#p213Results .p-real',{visible:true,timeout:30000}); await new Promise(r=>setTimeout(r,2000));
            const state=await page.evaluate(()=>({fast:window.__POUPAI_READER_FAST_PATH__,paywallLoaded:window.__POUPAI_PAYWALL_V217_LOADED__,paywallExists:!!document.querySelector('#poupaiPaywall'),pReal:document.querySelectorAll('#p213Results .p-real').length,pStatus:document.querySelectorAll('#p213Results .p-status').length,diagText:[...document.querySelectorAll('#p213Results .p-real')].map(x=>({status:!!x.querySelector('.p-status'),text:x.innerText.slice(0,250)})),resultsHTML:document.querySelector('#p213Results')?.innerHTML.slice(0,2000)})); console.log('STATE='+JSON.stringify(state)); console.log('ERRORS='+JSON.stringify(errs)); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node mobile-debug.cjs
