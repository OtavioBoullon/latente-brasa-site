name: Poupai Engine Tests

on:
  push:
    branches:
      - poupai-v4-full-public
    paths:
      - 'engine/**'
      - 'api/**'
      - 'public/poupai-v4-full/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/poupai-engine-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate production API syntax
        run: node --check api/read-bill.js && node --check api/find-offers.js && node --check api/check-availability.js && node --check api/run-pipeline.js && node --check api/health.js && node --check api/smoke-production.js
      - name: Build site
        run: npm run build
      - name: Run V1 tests
        run: node engine/test/run-v1.mjs
      - name: Run V1.1 tests
        run: node engine/test/run-v11.mjs
      - name: Run Reader V2 tests
        run: node engine/test/run-reader-v2.mjs
      - name: Run Market V2 tests
        run: node engine/test/run-market-v2.mjs
      - name: Run Provider Checker logic tests
        run: node engine/test/run-provider-checkers-v21.mjs
      - name: Run Hardening V2.2 tests
        run: node engine/test/run-hardening-v22.mjs
      - name: Run Real Bill V2.3 tests
        run: node engine/test/run-real-bill-v23.mjs
      - name: Run Billing Baseline V2.4 compatibility tests
        run: node engine/test/run-billing-baseline-v24.mjs
      - name: Run Public Real Bills V2.5 corpus
        run: node engine/test/run-public-bills-v25.mjs
      - name: Run V2.5 live pipeline integration tests
        run: node engine/test/run-pipeline-v25.mjs
      - name: Validate V4 frontend integration script
        run: node engine/test/run-site-integration-v25.mjs
      - name: Smoke test public Vercel auth
        env:
          POUPAI_HEALTH_URL: https://latente-brasa-site.vercel.app/api/health
        run: |
          set -e
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/poupai-health.json -w '%{http_code}' "$POUPAI_HEALTH_URL" || true)
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then
              cat /tmp/poupai-health.json
              node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/poupai-health.json','utf8'));if(j.ok!==true||j.ai?.authAvailable!==true)process.exit(1);console.log('PUBLIC_HEALTH_PASS',j.ai.authMode,j.release)"
              break
            fi
            if [ "$i" = "30" ]; then cat /tmp/poupai-health.json || true; exit 1; fi
            sleep 5
          done
      - name: Smoke test production Reader and Market
        run: |
          set -e
          reader_code=$(curl -L -sS --max-time 75 -o /tmp/poupai-reader.json -w '%{http_code}' 'https://latente-brasa-site.vercel.app/api/smoke-production?mode=reader' || true)
          echo "reader_http=$reader_code"
          cat /tmp/poupai-reader.json || true
          test "$reader_code" = "200"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/poupai-reader.json','utf8'));if(j.ok!==true||!j.aiTransport||!j.providerModel)process.exit(1);console.log('READER_PRODUCTION_PASS',j.aiTransport,j.providerModel,j.nextStep)"

          market_code=$(curl -L -sS --max-time 75 -o /tmp/poupai-market.json -w '%{http_code}' 'https://latente-brasa-site.vercel.app/api/smoke-production?mode=market' || true)
          echo "market_http=$market_code"
          cat /tmp/poupai-market.json || true
          test "$market_code" = "200"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/poupai-market.json','utf8'));if(j.ok!==true||!j.aiTransport||!j.providerModel||!j.searchTool)process.exit(1);console.log('MARKET_PRODUCTION_PASS',j.aiTransport,j.providerModel,j.searchTool,j.acceptedOffers)"
