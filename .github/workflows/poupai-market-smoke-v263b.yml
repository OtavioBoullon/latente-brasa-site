name: Poupai Market Smoke V2.6.3B

on:
  push:
    branches: [poupai-v4-full-public]
    paths: ['.github/workflows/poupai-market-smoke-v263b.yml']

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test Market
        run: |
          set -e
          printf '%s' '{"cep":"01001-000","city":"São Paulo","state":"SP"}' > /tmp/market-request.json
          code=$(curl -L -sS --max-time 25 -H 'Content-Type: application/json' --data-binary @/tmp/market-request.json -o /tmp/market.json -w '%{http_code}' 'https://latente-brasa-site.vercel.app/api/find-offers' || true)
          echo "market_http=$code"
          cat /tmp/market.json || true
          test "$code" = "200"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/market.json'));if(j.aiTransport!=='none-deterministic-market'||j.searchTool!=='official_page_fetch'||!j.result)process.exit(1);console.log('MARKET_PASS','latency='+j.metrics?.latencyMs,'pages='+j.sourceFetch?.fetched,'raw='+j.metrics?.rawOffers,'accepted='+j.metrics?.acceptedOffers,j.nextStep)"
      - name: Test Pipeline
        run: |
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const market=JSON.parse(fs.readFileSync('/tmp/market.json','utf8'));
          const extraction={documentType:'internet_bill',provider:'TIM',planName:'Internet Fibra 500 Mega',internetMonthlyPrice:99.99,invoiceTotal:99.99,speedMbps:500,technology:'Fibra',cep:'01001-000',city:'São Paulo',state:'SP',dueDate:'10/09/2026',billingPeriod:'agosto/2026',bundleDetected:false,internetPriceIsolated:true,contractMonths:null,loyaltyEndDate:null,promotion:{detected:false,description:null,discountAmount:null,promotionalPrice:null,regularPrice:null,remainingMonths:null,endDate:null},reajustment:{detected:false,description:null,previousPrice:null,newPrice:null,percentage:null},extras:[],confidence:{provider:1,internetMonthlyPrice:1,invoiceTotal:1,speedMbps:1,cep:1,overall:1},evidence:{provider:'TIM',internetMonthlyPrice:'Mensalidade: R$ 99,99',invoiceTotal:'Total a pagar: R$ 99,99',speedMbps:'Internet Fibra 500 Mega',cep:'CEP 01001-000',promotion:null,reajustment:null},warnings:[]};
          fs.writeFileSync('/tmp/pipeline-request.json',JSON.stringify({extraction,marketResult:market.result,engineConfig:{}}));
          NODE
          code=$(curl -L -sS --max-time 20 -H 'Content-Type: application/json' --data-binary @/tmp/pipeline-request.json -o /tmp/pipeline.json -w '%{http_code}' 'https://latente-brasa-site.vercel.app/api/run-pipeline' || true)
          echo "pipeline_http=$code"
          cat /tmp/pipeline.json
          test "$code" = "200"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/pipeline.json'));if(!j.version||!j.freeDiagnosis)process.exit(1);console.log('PIPELINE_PASS',j.version,j.freeDiagnosis.decision||j.safeDecision?.decision||j.decisionReason)"
