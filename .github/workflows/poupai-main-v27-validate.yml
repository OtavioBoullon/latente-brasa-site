name: Poupai Main V2.8 Validation

on:
  push:
    branches: [poupai-v4-full-public]
    paths: ['.github/workflows/poupai-main-v27-validate.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check api/read-bill.js
          node --check api/find-offers.js
          cp public/poupai-v4-full/integration-v28.txt /tmp/poupai-integration-v28.js
          node --check /tmp/poupai-integration-v28.js
      - name: Build
        run: npm run build
      - name: Deterministic regression
        run: |
          node engine/test/run-reader-v2.mjs
          node engine/test/run-hardening-v22.mjs
          node engine/test/run-real-bill-v23.mjs
          node engine/test/run-billing-baseline-v24.mjs
          node engine/test/run-public-bills-v25.mjs
          node engine/test/run-pipeline-v25.mjs
