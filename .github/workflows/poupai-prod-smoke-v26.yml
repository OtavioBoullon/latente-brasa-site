name: Poupai Production Smoke V2.6

on:
  push:
    branches:
      - poupai-v4-full-public
    paths:
      - '.github/workflows/poupai-prod-smoke-v26.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production health
        run: |
          set -e
          for i in $(seq 1 20); do
            code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' 'https://latente-brasa-site.vercel.app/api/health' || true)
            echo "health_http=$code"
            cat /tmp/health.json || true
            if [ "$code" = "200" ] && node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/health.json'));if(j.release!=='2.6.2-gemini-cardless'||j.ai?.authAvailable!==true||j.ai?.readerModel!=='gemini-3.6-flash'||j.ai?.marketModel!=='gemini-3.6-flash')process.exit(1)"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Test Reader
        run: |
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const base64='';
          fs.writeFileSync('/tmp/reader-request.json',JSON.stringify({filename:'synthetic-tim.png',mimeType:'image/png',base64}));
          NODE
          code=$(curl -L -sS --max-time 75 -H 'Content-Type: application/json' --data-binary @/tmp/reader-request.json -o /tmp/reader.json -w '%{http_code}' 'https://latente-brasa-site.vercel.app/api/read-bill' || true)
          echo "reader_http=$code"
          cat /tmp/reader.json
          test "$code" = "200"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/reader.json'));if(j.aiTransport!=='gemini-direct'||j.providerModel!=='gemini-3.6-flash'||!j.extraction)process.exit(1);console.log('READER_PASS',j.extraction.provider,j.extraction.speedMbps,j.extraction.internetMonthlyPrice,j.nextStep)"
      - name: Test Market and Pipeline
        run: |
          set -e
          printf '%s' '{"cep":"01001-000","city":"São Paulo","state":"SP"}' > /tmp/market-request.json
          code=$(curl -L -sS --max-time 90 -H 'Content-Type: application/json' --data-binary @/tmp/market-request.json -o /tmp/market.json -w '%{http_code}' 'https://latente-brasa-site.vercel.app/api/find-offers' || true)
          echo "market_http=$code"
          cat /tmp/market.json
          test "$code" = "200"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/market.json'));if(j.aiTransport!=='gemini-direct-free-tier'||j.providerModel!=='gemini-3.6-flash'||j.searchTool!=='official_page_fetch'||!j.result)process.exit(1);console.log('MARKET_PASS','pages='+j.sourceFetch?.fetched,'offers='+j.metrics?.acceptedOffers,j.nextStep)"
          node - <<'NODE'
          const fs=require('fs');
          const reader=JSON.parse(fs.readFileSync('/tmp/reader.json','utf8'));
          const market=JSON.parse(fs.readFileSync('/tmp/market.json','utf8'));
          fs.writeFileSync('/tmp/pipeline-request.json',JSON.stringify({extraction:reader.extraction,marketResult:market.result,engineConfig:{}}));
          NODE
          code=$(curl -L -sS --max-time 30 -H 'Content-Type: application/json' --data-binary @/tmp/pipeline-request.json -o /tmp/pipeline.json -w '%{http_code}' 'https://latente-brasa-site.vercel.app/api/run-pipeline' || true)
          echo "pipeline_http=$code"
          cat /tmp/pipeline.json
          test "$code" = "200"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/pipeline.json'));if(!j.version||!j.freeDiagnosis)process.exit(1);console.log('PIPELINE_PASS',j.version,j.freeDiagnosis.decision||j.safeDecision?.decision||j.decisionReason)"
